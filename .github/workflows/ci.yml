name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # weekly: catches runner image changes (apparmor, apt) on an unchanged tree
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }} # every main commit gets a full verdict

defaults:
  run:
    shell: bash # -eo pipefail, so `| tee` keeps a failing exit status

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # lint checks the commit messages this branch adds over main
      # Zig and the lint tools, pinned in mise.toml
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      - name: zig fmt, project rules, Zig pins, shellcheck, ruff, actionlint
        run: zig build lint

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm] # x86_64 and aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: zig hyperfine # the lint tools are the lint job's
      - name: Tools the tests use
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq bubblewrap ripgrep fd-find
          sudo ln -sf "$(command -v fdfind)" /usr/bin/fd
          # Ubuntu 24.04 blocks unprivileged user namespaces; awl's sandbox (bubblewrap) needs them
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build
        run: zig build -Doptimize=ReleaseSmall
      - name: Unit tests (Debug, runtime safety checks on)
        run: zig build test
      - name: Budgets (peak RSS, startup; size and idle RSS reported)
        run: |
          zig build check 2>&1 | tee "$RUNNER_TEMP/check.txt"
          {
            echo "### Budgets on $(uname -m)"
            echo '```'
            grep -E '^(ok|    )' "$RUNNER_TEMP/check.txt"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
      - name: End-to-end and TUI tests
        run: zig build e2e
      - name: Sandbox escape tests
        run: zig build sandbox
      - name: Offline arena proxy test
        run: python3 arena/test_proxy.py "$PWD/zig-out/bin/awl"

  # Every commit on main gets downloadable release binaries (zig build release; same
  # flags as a release, but the Zig comes from mise, not release.sh's checked download).
  binaries:
    if: github.event_name == 'push'
    needs: [lint, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: zig
      - run: |
          zig build release
          cd zig-out/release && sha256sum awl-linux-x86_64 awl-linux-aarch64 | tee SHA256SUMS
          for f in awl-linux-*; do echo "- $f: $(stat -c %s "$f") B"; done >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: awl-${{ github.sha }}
          path: zig-out/release/
          retention-days: 14
          if-no-files-found: error
